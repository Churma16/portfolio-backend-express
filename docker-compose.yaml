

services:
  # 1. Aplikasi Express
  api:
    build: .
    container_name: express_portfolio
    environment:
      - PORT=4000
      # Gunakan variabel env untuk koneksi database
      - DB_HOST=${DB_HOST_GO}
      - DB_PORT=${DB_PORT_GO}
      - DB_USER=${DB_USER_GO}
      - DB_PASSWORD=${DB_PASSWORD_GO}
      - DB_NAME=${DB_NAME_GO}
      - REDIS_URL=redis://express_redis:6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
    restart: always
    networks:
      - portfolio_network

  # 2. Redis Cache khusus Express
  redis:
    image: redis:7-alpine
    container_name: express_redis
    restart: always
    networks:
      - portfolio_network

  # 3. Web Server (Nginx)
  nginx:
    image: nginx:alpine
    container_name: express_nginx
    restart: always
    ports:
      - "8002:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
    networks:
      - portfolio_network

networks:
  portfolio_network:
    external: true
    name: go-portfolio-api_portfolio_network
